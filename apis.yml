aid: tesseractenergy
name: Fuse Energy
description: >-
  Fuse Energy (originally launched as Tesseract) is a UK-based, vertically integrated
  energy supplier founded by former Revolut executives Alan Chang and Charles Orr. It
  buys power from generators and supplies gas and electricity directly to residential
  and business customers, positioning itself to beat the UK price cap with variable,
  fixed and multi-rate tariffs, 30-minute billing updates, EV charging, solar/battery
  export tracking and an in-app AI assistant called "Plugs." The company raised $78M
  led by Balderton Capital and Lakestar. Surfaced in the API Evangelist network as a
  portfolio-company lead; as of this enrichment pass Fuse Energy publishes only a
  consumer-facing web and mobile app and no public developer API, SDK, or documentation.
